name: uptime

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Production answers
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error::Repository variable PROD_URL is not set"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors "$PROD_URL/health/ready"
          curl -fsS "$PROD_URL/api/users/" > /dev/null
          echo "$(date -u +%FT%TZ) $PROD_URL is up" >> "$GITHUB_STEP_SUMMARY"