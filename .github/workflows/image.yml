name: image

# Builds, scans and (on push) publishes the image.
on:
  workflow_call:
    outputs:
      digest:
        description: sha256 digest published to GHCR (empty on pull requests)
        value: ${{ jobs.build.outputs.digest }}
      reused:
        description: true when the image of this app/ tree already existed
        value: ${{ jobs.build.outputs.reused }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alexcornej0/devsu-technical-test

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Image identity = git tree hash of app/
        id: identity
        run: echo "app_tree=$(git rev-parse HEAD:app)" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: scripts/install-tool.sh trivy

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the image if app/ did not change
        id: reuse
        env:
          APP_TREE: ${{ steps.identity.outputs.app_tree }}
        run: |
          reused=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
             && docker buildx imagetools inspect "$IMAGE:app-$APP_TREE" > /dev/null 2>&1; then
            reused=true
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "Reuse existing image: $reused"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.reuse.outputs.reused == 'false'

      - name: Build
        if: steps.reuse.outputs.reused == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: app
          platforms: linux/amd64
          load: true
          push: false
          tags: demo-api:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Choose what to scan
        id: target
        env:
          APP_TREE: ${{ steps.identity.outputs.app_tree }}
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: |
          if [ "$REUSED" = "true" ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:app-$APP_TREE" --format '{{json .Manifest}}' | jq -r .digest)
            echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          else
            echo "ref=demo-api:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy (fails on fixable HIGH or CRITICAL)
        env:
          REF: ${{ steps.target.outputs.ref }}
        run: |
          trivy image --format sarif --output trivy.sarif --severity CRITICAL,HIGH --ignore-unfixed "$REF"
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$REF"

      - name: Upload Trivy results to Security
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Save the image for the integration job
        if: github.event_name == 'pull_request'
        run: docker save demo-api:ci -o image.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'pull_request'
        with:
          name: image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request'
        env:
          APP_TREE: ${{ steps.identity.outputs.app_tree }}
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: |
          if [ "$REUSED" = "false" ]; then
            docker tag demo-api:ci "$IMAGE:app-$APP_TREE"
            docker push "$IMAGE:app-$APP_TREE"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:app-$APP_TREE" --format '{{json .Manifest}}' | jq -r .digest)
          # One source = exact copy: same digest, one more tag
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        if: github.event_name != 'pull_request' && steps.reuse.outputs.reused == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          APP_TREE: ${{ steps.identity.outputs.app_tree }}
          REUSED: ${{ steps.reuse.outputs.reused }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| app/ tree | \`$APP_TREE\` |"
            echo "| Reused | $REUSED |"
            echo "| Digest | \`${DIGEST:-not published (pull request)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"