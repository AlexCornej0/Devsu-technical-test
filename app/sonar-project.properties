sonar.organization=alexcornej0
sonar.projectKey=AlexCornej0_Devsu-technical-test

# Paths are relative to app/
sonar.sources=.
sonar.exclusions=**/migrations/**,staticfiles/**,**/tests.py,**/tests_*.py
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests_*.py

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# Same exclusions as .coveragerc, so Sonar and the CI gate report the same number
sonar.coverage.exclusions=manage.py,demo/asgi.py,demo/wsgi.py,ops/**