apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.claimName }}
  labels:
    app.kubernetes.io/part-of: portfolio
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Never delete the data volume on "helm uninstall"
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}