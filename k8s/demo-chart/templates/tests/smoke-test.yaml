apiVersion: v1
kind: Pod
metadata:
  name: {{ include "demo.name" . }}-smoke-test
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke
      # Same image as the app
      image: {{ include "demo.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "ops/smoke_test.py"]
      env:
        - name: BASE_URL
          value: "http://{{ include "demo.name" . }}"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}